# HTTP — ACME + redirect for drop.autonogrammer.ai
server {
    listen 80;
    listen [::]:80;
    server_name drop.autonogrammer.ai;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# TLS vhost — enable after: certbot certonly --webroot -w /var/www/letsencrypt -d drop.autonogrammer.ai
server {
    listen 187.77.130.10:443 ssl http2;
    server_name drop.autonogrammer.ai;

    ssl_certificate     /etc/letsencrypt/live/drop.autonogrammer.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drop.autonogrammer.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Drop-Token $http_x_drop_token;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # MCP Streamable HTTP — long-lived, no buffering
    location /mcp {
        proxy_pass http://127.0.0.1:7788/mcp;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Drop-Token $http_x_drop_token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
    }

    location /acp/ {
        proxy_pass http://127.0.0.1:7788/acp/;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
