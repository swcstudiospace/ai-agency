name: CI — Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Gitleaks secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan
        run: gitleaks detect --source . --verbose --redact --exit-code 1

  dependency-audit:
    name: pip-audit + npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: pip-audit runtime deps
        run: |
          python -m pip install --upgrade pip pip-audit
          set +e
          pip-audit -r requirements.txt --progress-spinner off -f json -o pip-audit.json
          code=$?
          pip-audit -r requirements.txt --progress-spinner off
          # Surface findings as artifacts; do not hard-fail on transitive CVEs until baseline is clean
          echo "pip-audit_exit=$code"
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (cockpit)
        working-directory: agency-cockpit
        run: |
          npm ci
          npm audit --audit-level=critical || true
      - name: npm audit (docs-site)
        working-directory: docs-site
        run: |
          npm ci
          npm audit --audit-level=critical || true
      - name: npm audit (storefront)
        working-directory: storefront-oxygen
        run: |
          NODE_ENV=development npm ci --include=dev || NODE_ENV=development npm install --include=dev --legacy-peer-deps
          npm audit --audit-level=critical || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audits
          path: pip-audit.json
          if-no-files-found: ignore
          retention-days: 14
