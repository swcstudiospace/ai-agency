name: CI — Backend (SOTA)

on:
  push:
    branches: [main, master]
    paths:
      - "agents/**"
      - "app/**"
      - "tools/**"
      - "teams/**"
      - "workflows/**"
      - "scripts/**"
      - "evals/**"
      - "tests/**"
      - "prompts/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "agents/**"
      - "app/**"
      - "tools/**"
      - "teams/**"
      - "workflows/**"
      - "scripts/**"
      - "evals/**"
      - "tests/**"
      - "prompts/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/ci-backend.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  XAI_API_KEY: missing-ci-placeholder
  AGENCY_GROK_MODEL: grok-4.5
  AGENCY_DISABLE_HERMES_BRIDGE: "1"
  AGENCY_DISABLE_ANDA_BRAIN: "1"
  AGENCY_DISABLE_ANDA_KNOWLEDGE: "1"
  AGENCY_DISABLE_ANALYTICS: "1"
  LINEAR_GITHUB_LINK: "0"
  PYTHONPATH: "."

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check agents app tools teams workflows scripts tests evals
      - name: Ruff format check
        run: ruff format --check agents app tools teams workflows scripts tests evals || true

  unit-tests:
    name: Pytest + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile packages
        run: |
          python - <<'PY'
          import compileall, sys
          roots = ["agents","app","tools","teams","workflows","scripts","evals","tests","drop_server","hermes_bridge","kip_memory"]
          ok = all(compileall.compile_dir(r, quiet=1, force=True) for r in roots)
          sys.exit(0 if ok else 1)
          PY
      - name: Pytest with coverage
        run: |
          pytest tests/ \
            --cov=tools --cov=scripts --cov=agents --cov=app --cov=workflows \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=pytest-junit.xml
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml
            pytest-junit.xml
          retention-days: 14

  agent-evals:
    name: Structural agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run agent evals
        run: python -m evals.run_agent_evals

  readme-freshness:
    name: Living README gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: README freshness
        run: python -m scripts.check_readme_freshness
