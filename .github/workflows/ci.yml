name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/ci-backend.yml

  cockpit:
    uses: ./.github/workflows/ci-cockpit.yml

  docs:
    uses: ./.github/workflows/ci-docs.yml

  storefront:
    uses: ./.github/workflows/ci-storefront.yml

  security:
    uses: ./.github/workflows/ci-security.yml

  coderabbit:
    uses: ./.github/workflows/ci-coderabbit.yml

  ci-success:
    name: All CI gates green
    runs-on: ubuntu-latest
    needs: [backend, cockpit, docs, storefront, security, coderabbit]
    if: always()
    steps:
      - name: Check matrix
        run: |
          echo "backend=${{ needs.backend.result }}"
          echo "cockpit=${{ needs.cockpit.result }}"
          echo "docs=${{ needs.docs.result }}"
          echo "storefront=${{ needs.storefront.result }}"
          echo "security=${{ needs.security.result }}"
          echo "coderabbit=${{ needs.coderabbit.result }}"
          for r in "${{ needs.backend.result }}" "${{ needs.cockpit.result }}" \
                    "${{ needs.docs.result }}" "${{ needs.storefront.result }}" \
                    "${{ needs.security.result }}" "${{ needs.coderabbit.result }}"; do
            if [ "$r" != "success" ]; then
              echo "Gate failed: $r"
              exit 1
            fi
          done
          echo "All CI gates green"
