[package]
name = "agency-cockpit"
version = "0.1.0"
description = "Hermes × Agno Agency Cockpit"
authors = ["Autonogrammer"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agency_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.dev]
incremental = true

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
